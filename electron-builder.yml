appId: com.hive.app
productName: Hive
directories:
  buildResources: resources
  output: dist
files:
  - out/**/*
  - resources/**/*
  # Voice dictation: pnpm installs sherpa-onnx's speech engine for every
  # platform (pnpm.supportedArchitectures); ship only this build's binary.
  # ${platform} is the build host (darwin/linux); Windows re-includes under `win:`.
  - '!**/node_modules/sherpa-onnx-darwin-*/**'
  - '!**/node_modules/sherpa-onnx-linux-*/**'
  - '!**/node_modules/sherpa-onnx-win-*/**'
  - '**/node_modules/sherpa-onnx-${platform}-${arch}/**'

# hive:// deep links (account share links etc.)
protocols:
  - name: Hive
    schemes:
      - hive

# Native .node binaries cannot be loaded from inside an ASAR archive.
# This extracts them to app.asar.unpacked/ at build time.
asarUnpack:
  - '**/*.node'
  - '**/better-sqlite3/**'
  - '**/node-pty/**'
  # Voice dictation: sherpa-onnx's prebuilt speech engine (N-API addon plus the
  # onnxruntime dylibs next to it) and the utility-process worker that loads it.
  - '**/sherpa-onnx-node/**'
  - '**/sherpa-onnx-darwin-arm64/**'
  - '**/sherpa-onnx-darwin-x64/**'
  - '**/sherpa-onnx-linux-x64/**'
  - '**/sherpa-onnx-linux-arm64/**'
  - '**/sherpa-onnx-win-x64/**'
  - '**/sherpa-onnx-win-ia32/**'
  - 'out/main/voice-engine-worker.js'

# ── macOS ──────────────────────────────────────────────
mac:
  icon: resources/icon.icns
  extraResources:
    - from: src/native/build/Release/ghostty.node
      to: native/ghostty.node
    # Voice dictation pauses/resumes media through the vendored
    # mediaremote-adapter (BSD-3-Clause), run by /usr/bin/perl.
    - from: resources/mediaremote-adapter
      to: mediaremote-adapter
  extendInfo:
    NSMicrophoneUsageDescription: Hive records your voice to transcribe it into text.
  category: public.app-category.developer-tools
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: resources/entitlements.mac.plist
  entitlementsInherit: resources/entitlements.mac.inherit.plist
  target:
    - target: dmg
      arch:
        - arm64
        - x64
    - target: zip
      arch:
        - arm64
        - x64
  notarize: true

dmg:
  sign: false

# ── Windows ────────────────────────────────────────────
win:
  icon: resources/icon.ico
  files:
    # The package is named sherpa-onnx-win-<arch>, not win32 (see the top-level files list).
    - '**/node_modules/sherpa-onnx-win-${arch}/**'
  target:
    - target: nsis
      arch:
        - x64
    - target: zip
      arch:
        - x64

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
  artifactName: "Hive-Setup-${version}.${ext}"

# ── Linux ──────────────────────────────────────────────
linux:
  icon: resources/icon.png
  category: Development
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
    - target: tar.gz
      arch:
        - x64

deb:
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0
    - libuuid1

# ── Auto-update ───────────────────────────────────────
publish:
  - provider: github
    owner: morapelker
    repo: hive
