appId: com.hive.app
productName: Hive
directories:
  buildResources: resources
  output: dist
files:
  - out/**/*
  - resources/**/*
  # Voice dictation: pnpm installs sherpa-onnx's speech engine for every
  # platform (pnpm.supportedArchitectures); ship only this build's binary.
  # ${platform} is the build host (darwin/linux); Windows re-includes under `win:`.
  - '!**/node_modules/sherpa-onnx-darwin-*/**'
  - '!**/node_modules/sherpa-onnx-linux-*/**'
  - '!**/node_modules/sherpa-onnx-win-*/**'
  - '**/node_modules/sherpa-onnx-${platform}-${arch}/**'
  # The Claude Agent SDK's bundled Claude Code program, one ~200 MB package per platform. It
  # does not ship: the app runs the `claude` installed on the machine
  # (src/main/services/claude-binary-resolver.ts), and the SDK's own copy cannot start from a
  # packaged app anyway, its path is inside app.asar (`spawn ENOTDIR`). The pattern needs the
  # trailing dash, so the SDK itself (`claude-agent-sdk/`) stays.
  - '!**/node_modules/@anthropic-ai/claude-agent-sdk-*/**'
  # Nothing loads these from a packaged app: source maps, TypeScript sources and typings,
  # and the docs that libraries publish next to their code.
  - '!**/node_modules/**/*.map'
  - '!**/node_modules/**/*.{ts,mts,cts,tsx}'
  - '!**/node_modules/**/*.{md,markdown}'

# Only the libraries the main process, the preload and the backend load at runtime are packed
# (package.json `dependencies`). Everything the renderer uses is compiled into out/renderer by
# Vite and listed under `devDependencies`; scripts/finish-build.mjs fails the build when the
# main, preload or backend output imports a library that is not a dependency.

# The app's interface is English only. Without this, Electron ships a language pack for every
# locale Chromium knows (about 220 folders, 46 MB installed). Spelled `en-US` on purpose:
# electron-builder keeps a pack whose name equals this or is its language prefix, so `en-US`
# keeps macOS's `en.lproj` and the `en-US.pak` of Windows and Linux, while `en` would keep
# the first and delete the second, the one pack Chromium cannot start without.
electronLanguages:
  - en-US

# hive:// deep links (account share links etc.)
protocols:
  - name: Hive
    schemes:
      - hive

# Native .node binaries cannot be loaded from inside an ASAR archive.
# This extracts them to app.asar.unpacked/ at build time.
asarUnpack:
  - '**/*.node'
  - '**/better-sqlite3/**'
  - '**/node-pty/**'
  # Voice dictation: sherpa-onnx's prebuilt speech engine (N-API addon plus the
  # onnxruntime dylibs next to it) and the utility-process worker that loads it.
  - '**/sherpa-onnx-node/**'
  - '**/sherpa-onnx-darwin-arm64/**'
  - '**/sherpa-onnx-darwin-x64/**'
  - '**/sherpa-onnx-linux-x64/**'
  - '**/sherpa-onnx-linux-arm64/**'
  - '**/sherpa-onnx-win-x64/**'
  - '**/sherpa-onnx-win-ia32/**'
  - 'out/main/voice-engine-worker.js'
  # Pictures and animations of the renderer (pet atlases, icons): tens of MB that almost never
  # change. Inside app.asar they are part of one file that is new on every release, so every
  # update fetches them again; unpacked, each one is its own file in the update zip and the
  # updater's block map skips the ones it already has. Electron reads an unpacked file through
  # its app.asar path, so the renderer's URLs do not change. The same files serve the renderer
  # and the browser Web UI (whose own copies scripts/finish-build.mjs drops, see
  # src/server/static.ts).
  - 'out/renderer/assets/*.{webp,png,jpg,jpeg,gif,lottie}'

# ── macOS ──────────────────────────────────────────────
mac:
  icon: resources/icon.icns
  extraResources:
    - from: src/native/build/Release/ghostty.node
      to: native/ghostty.node
    # Wakes a wedged libuv thread pool (src/main/services/perf-logging/threadpool-waker.ts);
    # built by scripts/build-uv-pool-waker.mjs (`build:native`).
    - from: src/native/uv-pool-waker/build/uv-pool-waker.node
      to: native/uv-pool-waker.node
    # Voice dictation pauses/resumes media through the vendored
    # mediaremote-adapter (BSD-3-Clause), run by /usr/bin/perl.
    - from: resources/mediaremote-adapter
      to: mediaremote-adapter
  extendInfo:
    NSMicrophoneUsageDescription: Hive records your voice to transcribe it into text.
  category: public.app-category.developer-tools
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: resources/entitlements.mac.plist
  entitlementsInherit: resources/entitlements.mac.inherit.plist
  target:
    - target: dmg
      arch:
        - arm64
        - x64
    - target: zip
      arch:
        - arm64
        - x64
  notarize: true

dmg:
  sign: false

# ── Windows ────────────────────────────────────────────
win:
  icon: resources/icon.ico
  files:
    # The package is named sherpa-onnx-win-<arch>, not win32 (see the top-level files list).
    - '**/node_modules/sherpa-onnx-win-${arch}/**'
  target:
    - target: nsis
      arch:
        - x64
    - target: zip
      arch:
        - x64

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
  artifactName: "Hive-Setup-${version}.${ext}"

# ── Linux ──────────────────────────────────────────────
linux:
  icon: resources/icon.png
  category: Development
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
    - target: tar.gz
      arch:
        - x64

deb:
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0
    - libuuid1

# ── Auto-update ───────────────────────────────────────
publish:
  - provider: github
    owner: morapelker
    repo: hive
